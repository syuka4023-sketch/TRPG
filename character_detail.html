<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キャラ詳細</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{font-family:sans-serif;margin:0;padding:20px;background:#f5f5f5;color:#222}
    .wrap{max-width:1000px;margin:0 auto}
    .card{background:#fff;padding:16px;border-radius:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    input, textarea, select, button{
      font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc
    }
    input, textarea, select{background:#fff}
    textarea{width:100%;min-height:90px;resize:vertical}
    .grow{flex:1;min-width:180px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .tag{
      display:inline-flex;align-items:center;gap:6px;
      background:#eee;padding:6px 10px;border-radius:999px;margin:4px
    }
    .thumb{
      width:130px;height:130px;object-fit:cover;border-radius:14px;background:#eee
    }
    .img-box{
      display:inline-flex;flex-direction:column;gap:8px;margin:8px;vertical-align:top
    }
    .q-item,.related-item,.view-item,.history-item{
      border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:10px;background:#fafafa
    }
    .muted{color:#666;font-size:14px}
    .hidden{display:none}
    a{color:#222}
    canvas{background:#fff;border-radius:16px;padding:8px}
    .session-name{
      display:inline-block;background:#eee;border-radius:999px;padding:4px 8px;margin:4px 6px 0 0;font-size:13px
    }
    @media (max-width: 768px){
      body{padding:12px}
      .card{padding:14px;border-radius:14px}
      .row{gap:8px}
      input, textarea, select, button{
        width:100%;
        min-width:0;
      }
      .grow{min-width:0}
    }

    .tag-suggestion-item{
      padding:10px 12px;
      border-top:1px solid #eee;
      cursor:pointer;
    }
    .tag-suggestion-item:first-child{
      border-top:none;
    }
    .tag-suggestion-item:hover{
      background:#f5f5f5;
    }

    #exportStage{
      position:absolute;
      top:0;
      left:-12000px;
      width:1754px;
    }
    .character-export{
      display:flex;
      flex-direction:column;
      width:1754px;
      height:2480px;
      padding:64px;
      color:#272b35;
      background:#fff;
      font-family:"Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      box-sizing:border-box;
      overflow:hidden;
    }
    .character-export__header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:32px;
      padding-bottom:28px;
      border-bottom:4px solid var(--character-color, #5d86dc);
    }
    .character-export__header-content{flex:1;min-width:0}
    .character-export__avatar,
    .character-export__avatar-placeholder{
      width:190px;height:190px;border-radius:16px;object-fit:cover;flex:0 0 auto
    }
    .character-export__avatar{border:1px solid #ccd4e1}
    .character-export__avatar-placeholder{
      display:grid;place-items:center;background:#eef3ff;color:#7180a0;font-size:18px;font-weight:700
    }
    .character-export__eyebrow{
      margin:0 0 10px;
      color:var(--character-color, #5d86dc);
      font-size:22px;
      font-weight:700;
      letter-spacing:.12em;
    }
    .character-export__name{
      margin:0;
      font-size:52px;
      line-height:1.2;
      word-break:break-word;
    }
    .character-export__tags{
      margin:0;
      color:#697386;
      font-size:20px;
      text-align:right;
    }
    .character-export__scenario-section{margin-top:32px}
    .character-export__scenario-list{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:20px;
      padding:20px;
    }
    .character-export__section{
      border:1px solid #ccd4e1;
      border-radius:12px;
      overflow:hidden;
    }
    .character-export__section-title{
      margin:0;
      padding:16px 20px;
      color:#25324c;
      background:#eef3ff;
      font-size:24px;
    }
    .character-export__scenario-card{
      min-height:116px;
      min-width:0;
      padding:16px;
      overflow:hidden;
      border:1px solid #dde3ec;
      border-radius:10px;
      background:#fafcff;
    }
    .character-export__scenario-title,
    .character-export__question-text{
      display:block;
      font-size:18px;
      font-weight:700;
      line-height:1.45;
      word-break:break-word;
    }
    .character-export__scenario-meta{
      display:block;
      margin-top:8px;
      color:#697386;
      font-size:15px;
      line-height:1.5;
    }
    .character-export__question-grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:20px;
      margin-top:28px;
    }
    .character-export__summary{
      display:grid;
      grid-template-columns:1.45fr 1fr;
      gap:20px;
      margin-top:28px;
    }
    .character-export__memo{
      max-height:290px;
      margin:0;
      padding:20px;
      color:#3b4352;
      font-size:17px;
      line-height:1.65;
      white-space:pre-wrap;
      overflow:hidden;
      word-break:break-word;
    }
    .character-export__radar-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:10px;
    }
    .character-export__radar{width:360px;height:360px}
    .character-export__question-group{min-width:0}
    .character-export__question-list{margin:0;padding:0;list-style:none}
    .character-export__question{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding:9px 14px;
      border-top:1px solid #dde3ec;
    }
    .character-export__question:first-child{border-top:none}
    .character-export__answer{
      flex:0 0 auto;
      margin:0;
      color:#3b4352;
      font-size:15px;
      line-height:1.45;
      white-space:nowrap;
      word-break:break-word;
    }
    .character-export__empty{
      padding:20px;
      color:#697386;
      font-size:19px;
    }
    .character-export__footer{
      margin-top:28px;
      color:#8993a4;
      font-size:16px;
      text-align:right;
    }
    .character-export__profile{
      display:flex;flex-wrap:wrap;gap:10px 24px;margin:14px 0 0;color:#3b4352;font-size:18px
    }
    .character-export__profile-item{display:flex;align-items:center;gap:8px}
    .character-export__color-chip{width:20px;height:20px;border-radius:50%;border:1px solid #b8c0cc}
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="characters.html">← キャラ一覧へ戻る</a></p>

    <div class="card">
      <div class="row" style="align-items:center;">
        <h2 id="pageTitle" style="margin:0;flex:1;">キャラ詳細</h2>
        <button id="editToggleBtn" type="button" onclick="toggleEditMode()">編集する</button>
        <button id="pngExportBtn" type="button" onclick="exportCharacterSummary()">PNG出力</button>
      </div>
    </div>

    <div id="viewMode">
      <div class="card">
        <div class="view-item"><b>名前:</b> <span id="viewName"></span></div>
        <div class="view-item"><b>性別:</b> <span id="viewGender"></span></div>
        <div class="view-item"><b>年齢:</b> <span id="viewAge"></span></div>
        <div class="view-item"><b>誕生日:</b> <span id="viewBirthday"></span></div>
        <div class="view-item"><b>イメージカラー:</b> <span id="viewImageColor"></span></div>
        <div class="view-item"><b>URL:</b> <span id="viewUrl"></span></div>
        <div class="view-item"><b>タグ:</b> <span id="viewTags"></span></div>
        <div class="view-item"><b>メモ:</b><br><span id="viewMemo"></span></div>
      </div>

      <div class="card">
        <h3>画像</h3>
        <div id="viewImages"></div>
      </div>

      <div class="card">
        <h3>通過したシナリオ</h3>
        <div id="scenarioHistory"></div>
      </div>

      <div class="card">
        <h3>関係のあるキャラ</h3>
        <div class="muted" style="margin-bottom:10px;">
          同じセッションに参加している管理キャラと、関連PCを表示します。
        </div>
        <div id="relatedCharacters"></div>
      </div>

      <div class="card">
        <h3>質問</h3>
        <div id="viewQuestions"></div>
      </div>

      <div class="card">
        <h3>レーダーチャート（カテゴリ合計）</h3>
        <canvas id="chart"></canvas>
      </div>
    </div>

    <div id="editMode" class="hidden">
      <div class="card">
        <div class="row">
          <input id="nameInput" class="grow" placeholder="キャラ名">
          <button type="button" onclick="saveCharacter()">保存</button>
          <button type="button" onclick="deleteCharacter()">削除</button>
        </div>
        <div class="row" style="margin-top:10px;align-items:center;">
          <input id="genderInput" placeholder="性別">
          <input id="ageInput" type="number" min="0" max="999" placeholder="年齢">
          <label>誕生日
            <select id="birthdayMonthInput" aria-label="誕生月" onchange="updateBirthdayDayOptions()"></select> 月
            <select id="birthdayDayInput" aria-label="誕生日"></select> 日
          </label>
          <label>イメージカラー <input id="imageColorInput" type="color" value="#5d86dc"></label>
        </div>
        <div style="margin-top:10px;">
          <input id="urlInput" class="grow" placeholder="URL（いあキャラ / ゆとシート / 紹介ページなど）">
        </div>
        <div style="margin-top:10px;">
          <input id="imageUrlInput" class="grow" placeholder="画像URLを直接貼る">
        </div>
        <div class="actions">
          <button type="button" onclick="importImageFromUrlInput()">URLから画像取得を試す</button>
          <button type="button" onclick="importImageFromImageUrl()">画像URLから取り込む</button>
        </div>
      </div>

      <div class="card">
        <h3>画像</h3>
        <div class="row">
          <input type="file" id="fileInput" accept="image/*">
          <button type="button" onclick="addImageFromFile()">画像追加</button>
        </div>
        <div class="muted" style="margin-top:8px;">画像は保存前に自動縮小されます。</div>
        <div id="images" style="margin-top:10px;"></div>
      </div>

      <div class="card">
        <h3>タグ</h3>
        <div class="row">
          <input id="tagInput" class="grow" placeholder="タグ名" oninput="renderTagSuggestions()">
          <button type="button" onclick="addTag()">タグ追加</button>
        </div>
        <div id="tagSuggestions" style="margin-top:10px;"></div>
        <div id="tags" style="margin-top:10px;"></div>
      </div>

      <div class="card">
        <h3>メモ</h3>
        <textarea id="memo"></textarea>
      </div>

      <div class="card">
        <h3>質問</h3>
        <div class="row" style="margin-bottom:10px;">
          <input id="newQuestionText" class="grow" placeholder="新しい質問文">
          <select id="newQuestionType">
            <option value="text">テキスト</option>
            <option value="scale">スライダー</option>
          </select>
          <button type="button" onclick="addQuestion()">質問追加</button>
        </div>
        <div id="questions"></div>
      </div>
    </div>
  </div>

  <div id="exportStage" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script>
    let character = null;
    let chartInstance = null;
    let isEditMode = false;
    let characterId = null;

    const CHART_CATEGORIES = QUESTION_GROUPS.map(group => group.category);

    async function resizeImageFile(file, maxSize = 800, quality = 0.68) {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const img = await new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = dataUrl;
      });

      return resizeImageFromImageElement(img, maxSize, quality);
    }

    async function resizeImageFromImageElement(img, maxSize = 800, quality = 0.68) {
      let { width, height } = img;

      if (width > height && width > maxSize) {
        height = Math.round((height * maxSize) / width);
        width = maxSize;
      } else if (height >= width && height > maxSize) {
        width = Math.round((width * maxSize) / height);
        height = maxSize;
      }

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, 0, 0, width, height);

      return canvas.toDataURL("image/jpeg", quality);
    }

    function toggleEditMode(forceValue) {
      isEditMode = typeof forceValue === "boolean" ? forceValue : !isEditMode;
      document.getElementById("viewMode").classList.toggle("hidden", isEditMode);
      document.getElementById("editMode").classList.toggle("hidden", !isEditMode);
      document.getElementById("editToggleBtn").textContent = isEditMode ? "表示に戻る" : "編集する";

      if (isEditMode) renderEditMode();
      else renderViewMode();
    }

    async function saveCharacter() {
      character.name = document.getElementById("nameInput").value.trim() || "無名キャラ";
      character.url = document.getElementById("urlInput").value.trim();
      character.imageUrl = document.getElementById("imageUrlInput").value.trim();
      character.memo = document.getElementById("memo").value;
      character.gender = document.getElementById("genderInput").value.trim();
      character.age = document.getElementById("ageInput").value;
      character.birthday = getBirthdayInputValue();
      character.imageColor = document.getElementById("imageColorInput").value;

      if (await saveAll()) {
        renderViewMode();
        toggleEditMode(false);
        alert("保存しました");
      }
    }

    async function deleteCharacter() {
      if (!confirm("このキャラクターを削除しますか？")) return;
      characters = characters.filter(c => toId(c.id) !== toId(characterId));
      removeCharacterFromSessions(characterId);

      if (await saveAll()) location.href = "characters.html";
    }

    async function addImageFromFile() {
      const file = document.getElementById("fileInput").files[0];
      if (!file) {
        alert("画像を選択してください");
        return;
      }

      try {
        const resized = await resizeImageFile(file, 640, 0.6);
        character.images = character.images || [];
        character.images.push(resized);

        const ok = await saveAll(false);
        if (ok) {
          document.getElementById("fileInput").value = "";
          renderImages();
        } else {
          character.images.pop();
        }
      } catch (e) {
        console.error(e);
        alert("画像の縮小または保存に失敗しました");
      }
    }

    async function deleteImage(index) {
      if (!confirm("この画像を削除しますか？")) return;
      character.images.splice(index, 1);
      await saveAll(false);
      renderImages();
    }

    async function moveImage(index, dir) {
      const next = index + dir;
      if (next < 0 || next >= character.images.length) return;
      [character.images[index], character.images[next]] = [character.images[next], character.images[index]];
      await saveAll(false);
      renderImages();
    }

    function renderImages() {
      const box = document.getElementById("images");
      box.innerHTML = (character.images || []).map((img, i) => `
        <div class="img-box">
          <img class="thumb" src="${img}" alt="">
          <div class="actions">
            <button type="button" onclick="moveImage(${i}, -1)">←</button>
            <button type="button" onclick="moveImage(${i}, 1)">→</button>
            <button type="button" onclick="deleteImage(${i})">削除</button>
          </div>
        </div>
      `).join("") || "画像なし";
    }

    function ensureCharacterCollections() {
      character.images = Array.isArray(character.images) ? character.images : [];
      character.tags = Array.isArray(character.tags) ? character.tags : [];
      character.questions = Array.isArray(character.questions) && character.questions.length
        ? character.questions
        : defaultQuestions();
    }

    async function addTag() {
      const input = document.getElementById("tagInput");
      const val = input.value.trim();
      if (!val) return;

      character.tags = character.tags || [];
      if (!character.tags.includes(val)) {
        character.tags.push(val);
        await saveAll(false);
      }
      input.value = "";
      renderTags();
      renderTagSuggestions();
    }

    async function deleteTag(index) {
      character.tags.splice(index, 1);
      await saveAll(false);
      renderTags();
      renderTagSuggestions();
    }

    function renderTags() {
      document.getElementById("tags").innerHTML =
        (character.tags || []).map((tag, i) => `
          <span class="tag">
            ${escapeHtml(tag)}
            <button type="button" onclick="deleteTag(${i})">×</button>
          </span>
        `).join("") || "タグなし";
    }

    async function addQuestion() {
      const q = document.getElementById("newQuestionText").value.trim();
      const type = document.getElementById("newQuestionType").value;
      if (!q) return;

      character.questions.push({
        id: uid(),
        q,
        type,
        value: type === "scale" ? 3 : ""
      });

      await saveAll(false);
      document.getElementById("newQuestionText").value = "";
      renderQuestions();
      drawChart();
    }

    async function updateQuestionText(index, value) {
      character.questions[index].q = value;
      await saveAll(false);
      drawChart();
    }

    async function updateQuestionValue(index, value) {
      const q = character.questions[index];
      if (!q) return;

      q.value = q.type === "scale" ? Number(value) : value;
      await saveAll(false);

      if (q.type === "scale") {
        renderQuestions();
        drawChart();
      }
    }

    async function deleteQuestion(index) {
      if (!confirm("この質問を削除しますか？")) return;
      character.questions.splice(index, 1);
      await saveAll(false);
      renderQuestions();
      drawChart();
    }

    function renderQuestions() {
      const box = document.getElementById("questions");
      box.innerHTML = (character.questions || []).map((q, i) => `
        <div class="q-item">
          <div class="row">
            ${q.category ? `<div class="muted">カテゴリ: ${escapeHtml(q.category)}</div>` : ""}
            <input class="grow" value="${escapeHtml(q.q)}" oninput="updateQuestionText(${i}, this.value)">
            <button type="button" onclick="deleteQuestion(${i})">削除</button>
          </div>
          ${
            q.type === "scale"
              ? `
                <div style="margin-top:10px;">
                  <div class="muted">1: いいえ 〜 5: はい</div>
                  <input type="range" min="1" max="5" step="1" value="${Number(q.value || 3)}"
                    oninput="updateQuestionValue(${i}, this.value)">
                  <div>現在値: ${Number(q.value || 3)}</div>
                </div>
              `
              : `
                <div style="margin-top:10px;">
                  <textarea oninput="updateQuestionValue(${i}, this.value)">${escapeHtml(q.value || "")}</textarea>
                </div>
              `
          }
        </div>
      `).join("") || "質問なし";
    }

    function getFirstDateValue(session) {
      const first = Array.isArray(session.dates) && session.dates.length ? session.dates[0] : "";
      const t = Date.parse(first);
      return Number.isNaN(t) ? -Infinity : t;
    }

    function renderScenarioHistory() {
      const participated = getSessionsByCharacterId(characterId)
        .slice()
        .sort((a, b) => getFirstDateValue(b) - getFirstDateValue(a));

      document.getElementById("scenarioHistory").innerHTML = participated.map(s => {
        const scenario = getScenarioById(s.scenarioId);
        const title = scenario?.title || s.title || "無題セッション";
        return `
          <div class="history-item">
            <div><b>${escapeHtml(title)}</b></div>
            <div class="muted">日付: ${escapeHtml((s.dates || []).join(" / ") || "未設定")}</div>
            <div class="muted">状態: ${escapeHtml(s.status || "予定")}</div>
            <div class="muted">
              <a href="session_detail.html?id=${encodeURIComponent(s.id)}">セッション詳細を見る</a>
            </div>
          </div>
        `;
      }).join("") || "通過履歴なし";
    }

    function getScenarioHistoryForExport() {
      return getSessionsByCharacterId(characterId)
        .slice()
        .sort((a, b) => getFirstDateValue(b) - getFirstDateValue(a))
        .slice(0, 3)
        .map(session => {
          const scenario = getScenarioById(session.scenarioId);
          return {
            title: scenario?.title || session.title || "無題セッション",
            dates: (session.dates || []).join(" / ") || "日付未設定",
            status: session.status || "予定"
          };
        });
    }

    function appendExportElement(parent, tagName, className, text = "") {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      if (text) element.textContent = text;
      parent.append(element);
      return element;
    }

    function createExportSection(title) {
      const section = document.createElement("section");
      section.className = "character-export__section";
      appendExportElement(section, "h2", "character-export__section-title", title);
      return section;
    }

    function appendExportImage(parent, source, imageClass, placeholderClass, placeholderText) {
      if (!source) {
        appendExportElement(parent, "div", placeholderClass, placeholderText);
        return;
      }

      const image = document.createElement("img");
      image.className = imageClass;
      image.src = source;
      image.alt = "";
      image.crossOrigin = "anonymous";
      image.onerror = () => {
        const placeholder = document.createElement("div");
        placeholder.className = placeholderClass;
        placeholder.textContent = placeholderText;
        image.replaceWith(placeholder);
      };
      parent.append(image);
    }

    function formatQuestionAnswer(question) {
      if (question.type !== "scale") return question.value || "未回答";

      const value = Math.min(5, Math.max(1, Number(question.value) || 3));
      return `${"●".repeat(value)}${"○".repeat(5 - value)}  ${value} / 5`;
    }

    function getChartCategoryTotals() {
      return CHART_CATEGORIES.map(category =>
        (character.questions || [])
          .filter(question => question.type === "scale" && question.category === category)
          .reduce((total, question) => total + (Number(question.value) || 0), 0)
      );
    }

    function getCharacterColor() {
      return /^#[0-9a-fA-F]{6}$/.test(character?.imageColor || "") ? character.imageColor : "#5d86dc";
    }

    function formatBirthday(value) {
      const match = String(value || "").match(/(?:\d{4}-)?(\d{2})-(\d{2})$/);
      return match ? `${Number(match[1])}月${Number(match[2])}日` : "未設定";
    }

    function populateBirthdayInputs() {
      const monthInput = document.getElementById("birthdayMonthInput");
      monthInput.innerHTML = `<option value="">月</option>${Array.from({ length: 12 }, (_, index) => `<option value="${String(index + 1).padStart(2, "0")}">${index + 1}</option>`).join("")}`;
      updateBirthdayDayOptions();
    }

    function updateBirthdayDayOptions() {
      const month = Number(document.getElementById("birthdayMonthInput").value);
      const dayInput = document.getElementById("birthdayDayInput");
      const currentValue = dayInput.value;
      const days = month === 2 ? 29 : [4, 6, 9, 11].includes(month) ? 30 : 31;
      dayInput.innerHTML = `<option value="">日</option>${Array.from({ length: days }, (_, index) => `<option value="${String(index + 1).padStart(2, "0")}">${index + 1}</option>`).join("")}`;
      dayInput.value = currentValue;
    }

    function getBirthdayInputValue() {
      const month = document.getElementById("birthdayMonthInput").value;
      const day = document.getElementById("birthdayDayInput").value;
      return month && day ? `${month}-${day}` : "";
    }

    function hexToRgba(hex, alpha) {
      const value = hex.slice(1);
      const r = parseInt(value.slice(0, 2), 16);
      const g = parseInt(value.slice(2, 4), 16);
      const b = parseInt(value.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function drawExportRadarChart(canvas) {
      const size = 720;
      const center = size / 2;
      const radius = 245;
      const totals = getChartCategoryTotals();
      const color = getCharacterColor();
      const context = canvas.getContext("2d");
      canvas.width = size;
      canvas.height = size;

      context.clearRect(0, 0, size, size);
      context.font = '22px "Yu Gothic", sans-serif';
      context.textAlign = "center";
      context.textBaseline = "middle";

      const pointAt = (index, ratio) => {
        const angle = -Math.PI / 2 + (Math.PI * 2 * index) / CHART_CATEGORIES.length;
        return {
          x: center + Math.cos(angle) * radius * ratio,
          y: center + Math.sin(angle) * radius * ratio
        };
      };

      for (let step = 1; step <= 5; step += 1) {
        context.beginPath();
        CHART_CATEGORIES.forEach((_, index) => {
          const point = pointAt(index, step / 5);
          if (index === 0) context.moveTo(point.x, point.y);
          else context.lineTo(point.x, point.y);
        });
        context.closePath();
        context.strokeStyle = "#ccd4e1";
        context.lineWidth = 2;
        context.stroke();
      }

      CHART_CATEGORIES.forEach((category, index) => {
        const point = pointAt(index, 1);
        context.beginPath();
        context.moveTo(center, center);
        context.lineTo(point.x, point.y);
        context.strokeStyle = "#ccd4e1";
        context.lineWidth = 2;
        context.stroke();

        const labelPoint = pointAt(index, 1.18);
        context.fillStyle = "#25324c";
        context.fillText(`${category} ${totals[index]} / 50`, labelPoint.x, labelPoint.y);
      });

      context.beginPath();
      totals.forEach((total, index) => {
        const point = pointAt(index, Math.min(50, Math.max(0, total)) / 50);
        if (index === 0) context.moveTo(point.x, point.y);
        else context.lineTo(point.x, point.y);
      });
      context.closePath();
      context.fillStyle = hexToRgba(color, 0.28);
      context.fill();
      context.strokeStyle = color;
      context.lineWidth = 5;
      context.stroke();

      totals.forEach((total, index) => {
        const point = pointAt(index, Math.min(50, Math.max(0, total)) / 50);
        context.beginPath();
        context.arc(point.x, point.y, 7, 0, Math.PI * 2);
        context.fillStyle = color;
        context.fill();
      });
    }

    function createCharacterExportCard() {
      ensureCharacterCollections();

      const card = document.createElement("article");
      card.className = "character-export";
      card.style.setProperty("--character-color", getCharacterColor());

      const header = appendExportElement(card, "header", "character-export__header");
      const heading = document.createElement("div");
      heading.className = "character-export__header-content";
      appendExportElement(heading, "p", "character-export__eyebrow", "CHARACTER ARCHIVE");
      appendExportElement(heading, "h1", "character-export__name", character.name || "無名キャラ");
      const profile = appendExportElement(heading, "div", "character-export__profile");
      [["性別", character.gender || "未設定"], ["年齢", character.age ? `${character.age}歳` : "未設定"], ["誕生日", formatBirthday(character.birthday)]].forEach(([label, value]) => {
        const item = appendExportElement(profile, "span", "character-export__profile-item");
        appendExportElement(item, "b", "", label);
        appendExportElement(item, "span", "", value);
      });
      const colorItem = appendExportElement(profile, "span", "character-export__profile-item");
      appendExportElement(colorItem, "b", "", "イメージカラー");
      const chip = appendExportElement(colorItem, "span", "character-export__color-chip");
      chip.style.backgroundColor = getCharacterColor();
      appendExportElement(colorItem, "span", "", getCharacterColor());
      appendExportElement(
        heading,
        "p",
        "character-export__tags",
        character.tags.length ? `タグ: ${character.tags.join(" / ")}` : "タグなし"
      );
      header.append(heading);
      appendExportImage(
        header,
        character.images[0] || character.imageUrl,
        "character-export__avatar",
        "character-export__avatar-placeholder",
        "NO IMAGE"
      );

      const scenariosSection = createExportSection("通過したシナリオ（最新3件）");
      scenariosSection.classList.add("character-export__scenario-section");
      const scenarioHistory = getScenarioHistoryForExport();

      if (scenarioHistory.length) {
        const list = appendExportElement(scenariosSection, "div", "character-export__scenario-list");
        scenarioHistory.forEach(scenario => {
          const item = appendExportElement(list, "article", "character-export__scenario-card");
          appendExportElement(item, "span", "character-export__scenario-title", scenario.title);
          appendExportElement(
            item,
            "span",
            "character-export__scenario-meta",
            `${scenario.dates} ／ ${scenario.status}`
          );
        });
      } else {
        appendExportElement(scenariosSection, "p", "character-export__empty", "通過履歴なし");
      }
      card.append(scenariosSection);

      const summary = appendExportElement(card, "div", "character-export__summary");
      const memoSection = createExportSection("キャラメモ");
      appendExportElement(memoSection, "p", "character-export__memo", character.memo || "メモなし");
      summary.append(memoSection);

      const radarSection = createExportSection("レーダーチャート（合計 / 50）");
      const radarWrap = appendExportElement(radarSection, "div", "character-export__radar-wrap");
      const radarCanvas = document.createElement("canvas");
      radarCanvas.className = "character-export__radar";
      radarWrap.append(radarCanvas);
      drawExportRadarChart(radarCanvas);
      summary.append(radarSection);

      const questionGrid = appendExportElement(card, "div", "character-export__question-grid");
      QUESTION_GROUPS.forEach(({ category }) => {
        const questionsSection = createExportSection(category);
        questionsSection.classList.add("character-export__question-group");
        const list = appendExportElement(questionsSection, "ul", "character-export__question-list");

        character.questions
          .filter(question => question.category === category)
          .forEach(question => {
            const item = appendExportElement(list, "li", "character-export__question");
            appendExportElement(item, "span", "character-export__question-text", question.q || "質問");
            appendExportElement(item, "p", "character-export__answer", formatQuestionAnswer(question));
          });

        if (!list.children.length) {
          appendExportElement(questionsSection, "p", "character-export__empty", "質問なし");
        }
        questionGrid.append(questionsSection);
      });

      const additionalQuestions = character.questions.filter(question => !question.category || !CHART_CATEGORIES.includes(question.category));
      if (additionalQuestions.length) {
        const questionsSection = createExportSection("追加した質問");
        questionsSection.classList.add("character-export__question-group");
        const list = appendExportElement(questionsSection, "ul", "character-export__question-list");
        additionalQuestions.forEach(question => {
          const item = appendExportElement(list, "li", "character-export__question");
          appendExportElement(item, "span", "character-export__question-text", question.q || "質問");
          appendExportElement(item, "p", "character-export__answer", formatQuestionAnswer(question));
        });
        questionGrid.append(questionsSection);
      }

      appendExportElement(
        card,
        "footer",
        "character-export__footer",
        `TRPG管理ツール  |  ${new Date().toLocaleDateString("ja-JP")}`
      );

      return card;
    }

    async function downloadCanvasAsPng(canvas, filename) {
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      if (!blob) throw new Error("画像データの作成に失敗しました");

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    async function exportCharacterSummary() {
      if (!window.html2canvas) {
        alert("画像出力の準備に失敗しました。ページを再読み込みして、もう一度お試しください。");
        return;
      }

      const button = document.getElementById("pngExportBtn");
      const stage = document.getElementById("exportStage");
      button.disabled = true;
      button.textContent = "画像を作成中…";
      stage.replaceChildren(createCharacterExportCard());

      try {
        const canvas = await html2canvas(stage.firstElementChild, {
          backgroundColor: "#ffffff",
          scale: 2,
          useCORS: true
        });
        const safeName = (character.name || "character").replace(/[\\/:*?\"<>|]/g, "_");
        await downloadCanvasAsPng(canvas, `${safeName}_character_summary_A3.png`);
      } catch (error) {
        console.error(error);
        alert("画像の出力に失敗しました。もう一度お試しください。");
      } finally {
        stage.replaceChildren();
        button.disabled = false;
        button.textContent = "PNG出力";
      }
    }

    function renderRelatedCharacters() {
      const related = getRelatedCharacters(characterId);

      document.getElementById("relatedCharacters").innerHTML = related.map(item => {
        if (item.type === "character") {
          const charId = item.character?.id ? encodeURIComponent(item.character.id) : "";
          return `
            <div class="related-item">
              <div>
                ${
                  charId
                    ? `<a href="character_detail.html?id=${charId}"><b>${escapeHtml(item.displayName || item.character?.name || "未設定")}</b></a>`
                    : `<b>${escapeHtml(item.displayName || "未設定")}</b>`
                }
              </div>
              <div class="muted">一緒だったセッション:</div>
              <div>
                ${item.sessions.map(s => `<span class="session-name">${escapeHtml(s.title)}</span>`).join("")}
              </div>
            </div>
          `;
        }

        return `
          <div class="related-item">
            <div><b>関連PC: ${escapeHtml(item.displayName || item.relatedPC?.pc || "未設定")}</b></div>
            <div class="muted">PL: ${escapeHtml(item.relatedPC?.player || "未設定")}</div>
            <div class="muted">
              ${item.relatedPC?.url ? `<a href="${escapeHtml(item.relatedPC.url)}" target="_blank" rel="noopener noreferrer">URLを開く</a>` : "URLなし"}
            </div>
            <div class="muted" style="margin-top:8px;">一緒だったセッション:</div>
            <div>
              ${item.sessions.map(s => `<span class="session-name">${escapeHtml(s.title)}</span>`).join("")}
            </div>
          </div>
        `;
      }).join("") || "関係のあるキャラなし";
    }

    function renderViewMode() {
      ensureCharacterCollections();

      document.getElementById("pageTitle").textContent = character.name || "キャラ詳細";
      document.getElementById("viewName").textContent = character.name || "無名キャラ";
      document.getElementById("viewGender").textContent = character.gender || "未設定";
      document.getElementById("viewAge").textContent = character.age ? `${character.age}歳` : "未設定";
      document.getElementById("viewBirthday").textContent = formatBirthday(character.birthday);
      document.getElementById("viewImageColor").innerHTML = `<span style="display:inline-block;width:16px;height:16px;vertical-align:middle;margin-right:6px;border:1px solid #aaa;border-radius:50%;background:${getCharacterColor()}"></span>${getCharacterColor()}`;
      document.getElementById("viewUrl").innerHTML = character.url
        ? `<a href="${escapeHtml(character.url)}" target="_blank" rel="noopener noreferrer">URLを開く</a>`
        : "未設定";
      document.getElementById("viewTags").textContent = (character.tags || []).join(" / ") || "なし";
      document.getElementById("viewMemo").textContent = character.memo || "未設定";

      document.getElementById("viewImages").innerHTML =
        character.images && character.images.length
          ? character.images.map(img => `
              <div class="img-box">
                <img class="thumb" src="${img}" alt="">
              </div>
            `).join("")
          : (
              character.imageUrl
                ? `<div class="muted">画像未登録。<a href="${escapeHtml(character.imageUrl)}" target="_blank" rel="noopener noreferrer">画像URLを開く</a></div>`
                : character.url
                  ? `<div class="muted">画像取得失敗。<a href="${escapeHtml(character.url)}" target="_blank" rel="noopener noreferrer">URLを開く</a></div>`
                  : "画像なし"
            );

      document.getElementById("viewQuestions").innerHTML = character.questions.map(q => `
        <div class="q-item">
          ${q.category ? `<div class="muted">カテゴリ: ${escapeHtml(q.category)}</div>` : ""}
          <div><b>${escapeHtml(q.q)}</b></div>
          <div class="muted" style="margin-top:8px;">
            ${q.type === "scale" ? `回答: ${Number(q.value || 3)}` : escapeHtml(q.value || "未回答")}
          </div>
        </div>
      `).join("") || "質問なし";

      renderScenarioHistory();
      renderRelatedCharacters();
      drawChart();
    }

    function renderEditMode() {
      ensureCharacterCollections();

      document.getElementById("nameInput").value = character.name || "";
      document.getElementById("urlInput").value = character.url || "";
      document.getElementById("imageUrlInput").value = character.imageUrl || "";
      document.getElementById("memo").value = character.memo || "";
      document.getElementById("genderInput").value = character.gender || "";
      document.getElementById("ageInput").value = character.age || "";
      populateBirthdayInputs();
      const birthdayMatch = String(character.birthday || "").match(/(?:\d{4}-)?(\d{2})-(\d{2})$/);
      document.getElementById("birthdayMonthInput").value = birthdayMatch?.[1] || "";
      updateBirthdayDayOptions();
      document.getElementById("birthdayDayInput").value = birthdayMatch?.[2] || "";
      document.getElementById("imageColorInput").value = getCharacterColor();

      renderImages();
      renderTags();
      renderQuestions();
      renderTagSuggestions();
    }

    function drawChart() {
      const canvas = document.getElementById("chart");
      const categoryTotals = getChartCategoryTotals();

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(canvas, {
        type: "radar",
        data: {
          labels: CHART_CATEGORIES,
          datasets: [{
            label: character.name || "キャラ",
            data: categoryTotals,
            backgroundColor: hexToRgba(getCharacterColor(), 0.28),
            borderColor: getCharacterColor(),
            pointBackgroundColor: getCharacterColor(),
            pointBorderColor: getCharacterColor()
          }]
        },
        options: {
          responsive: true,
          scales: {
            r: {
              min: 0,
              max: 50,
              ticks: { stepSize: 10 }
            }
          }
        }
      });
    }

    function guessImageCandidatesFromPageUrl(url) {
      const u = String(url || "").trim();
      if (!u) return [];

      const candidates = [];
      candidates.push(u + (u.includes("?") ? "&" : "?") + "image=1");
      candidates.push(u.replace(/\/$/, "") + "/image");
      candidates.push(u.replace(/\/$/, "") + "/img");
      candidates.push(u.replace(/\/$/, "") + "/portrait");
      candidates.push(u.replace(/\/$/, "") + "/icon");

      return [...new Set(candidates)];
    }

    async function loadImageElement(url) {
      return await new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.referrerPolicy = "no-referrer";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("画像読み込み失敗"));
        img.src = url;
      });
    }

    async function tryImportImageFromUrl(url, direct = false) {
      const targetUrls = direct
        ? [String(url || "").trim()].filter(Boolean)
        : guessImageCandidatesFromPageUrl(url);

      for (const candidate of targetUrls) {
        try {
          const img = await loadImageElement(candidate);
          const resized = await resizeImageFromImageElement(img, 800, 0.68);
          return { ok: true, imageDataUrl: resized, imageUrl: candidate };
        } catch (e) {
        }
      }

      return { ok: false, imageDataUrl: null, imageUrl: null };
    }

    async function importImage({
      inputId,
      characterProperty,
      direct,
      emptyMessage,
      successMessage,
      fallbackMessage
    }) {
      const url = document.getElementById(inputId).value.trim();
      if (!url) {
        alert(emptyMessage);
        return;
      }

      character[characterProperty] = url;

      const result = await tryImportImageFromUrl(url, direct);

      if (result.ok && result.imageDataUrl) {
        character.images = Array.isArray(character.images) ? character.images : [];
        character.images.unshift(result.imageDataUrl);

        const ok = await saveAll(false);
        if (!ok) {
          character.images.shift();
          return;
        }

        alert(successMessage);
        renderImages();
        renderViewMode();
        return;
      }

      const ok = await saveAll(false);
      if (!ok) return;

      alert(fallbackMessage);
      renderViewMode();
    }

    async function importImageFromUrlInput() {
      await importImage({
        inputId: "urlInput",
        characterProperty: "url",
        direct: false,
        emptyMessage: "URLを入力してください",
        successMessage: "画像取得に成功しました",
        fallbackMessage: "画像取得はできませんでした。URLのみ保存しました。"
      });
    }

    async function importImageFromImageUrl() {
      await importImage({
        inputId: "imageUrlInput",
        characterProperty: "imageUrl",
        direct: true,
        emptyMessage: "画像URLを入力してください",
        successMessage: "画像URLから取り込みました",
        fallbackMessage: "画像取得はできませんでした。画像URLのみ保存しました。"
      });
    }

    async function init() {
      await window.__dataReady;
      characterId = new URLSearchParams(location.search).get("id");
      character = getCharacterById(characterId);

      if (!character) {
        location.href = "characters.html";
        return;
      }

      renderViewMode();
      toggleEditMode(false);
    }

    function getAllExistingTags() {
      const tagSet = new Set();

      (characters || []).forEach(c => {
        (c.tags || []).forEach(tag => {
          const normalizedTag = String(tag || "").trim();
          if (normalizedTag) tagSet.add(normalizedTag);
        });
      });

      return [...tagSet].sort((a, b) => a.localeCompare(b, "ja"));
    }

    function selectTagSuggestion(tag) {
      document.getElementById("tagInput").value = tag;
      renderTagSuggestions();
    }

    function renderTagSuggestions() {
      const input = document.getElementById("tagInput");
      const box = document.getElementById("tagSuggestions");
      if (!input || !box) return;

      const keyword = String(input.value || "").trim().toLowerCase();
      if (!keyword) {
        box.innerHTML = "";
        return;
      }

      const currentTags = new Set((character.tags || []).map(t => String(t || "").trim()));
      const matched = getAllExistingTags()
        .filter(tag => tag.toLowerCase().includes(keyword))
        .filter(tag => !currentTags.has(tag))
        .slice(0, 10);

      box.innerHTML = matched.length ? `
        <div class="candidate-list">
          ${matched.map(tag => `
            <div class="tag-suggestion-item" onclick="selectTagSuggestion('${String(tag).replace(/'/g, "\\'")}')">
              ${escapeHtml(tag)}
            </div>
          `).join("")}
        </div>
      ` : "";
    }

    init();
